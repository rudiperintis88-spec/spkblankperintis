<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SPK Blank Perintis Perkasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:#17212F;font:14px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
/* ---- layar masuk ---- */
.lg{min-height:100%;display:grid;place-items:center;padding:24px;background:#fff}
.lg-card{width:min(400px,100%);background:#fff;border-radius:18px;padding:34px 30px 28px;border:1px solid #D3DAE4;box-shadow:none;text-align:center}
.lg-co{margin:0;color:#59667A}
.lg-card h1{margin:4px 0 24px;font:400 40px/1.05 "Instrument Serif",Georgia,"Times New Roman",serif}
.lg-field{position:relative}
.lg-field input{display:block;width:100%;height:54px;padding:0 54px;border:2px solid #111;border-radius:16px;background:#fff;color:#111;font:inherit;font-size:17px;text-align:center}
.lg-field input::placeholder{color:#6B6B6B;opacity:1;text-align:center}
.lg-field input:focus{outline:none;border-color:#111;box-shadow:0 0 0 4px rgba(40,70,216,.22)}
.lg-eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:38px;height:38px;padding:0;border:0;border-radius:50%;background:transparent;color:#4A4A4A;cursor:pointer;display:grid;place-items:center}
.lg-eye:hover{background:#F0F2F6}
.lg-eye:focus-visible{outline:3px solid #9CC0F0}
.lg-eye svg{width:28px;height:28px}
#lg-btn{display:block;width:100%;height:54px;margin-top:14px;border:0;border-radius:14px;background:#2846D8;color:#fff;font:inherit;font-size:18px;font-weight:700;text-align:center;cursor:pointer}
#lg-btn:hover{background:#2139B5}
#lg-btn:focus-visible{outline:3px solid #9CC0F0;outline-offset:2px}
#lg-btn:disabled{opacity:.7;cursor:progress}
#lg-err{min-height:22px;margin:14px 0 0;color:#B42318;font-weight:500;text-align:center}
/* ---- aplikasi ---- */
#app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.dv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding:10px 24px;background:#fff;color:#17212F;border-bottom:1px solid #D3DAE4}
.dv-brand{display:flex;flex-direction:column;line-height:1.2}
.dv-brand span{color:#59667A;font-size:12.5px}
.dv-brand b{font-size:17px}
.dv-tabs{display:flex;flex-wrap:wrap;gap:6px}
.dv-tab{appearance:none;border:1px solid transparent;border-radius:999px;background:transparent;color:#59667A;padding:8px 22px;font:inherit;font-weight:500;cursor:pointer}
.dv-tab:hover{background:#F1F4F8;color:#17212F}
.dv-tab[aria-selected="true"]{background:#1E3A5F;color:#fff;font-weight:700}
.dv-tab:focus-visible{outline:3px solid #9CC0F0;outline-offset:2px}
.dv-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.dv-mode{padding:3px 12px;border-radius:999px;border:1px solid #D3DAE4;background:#fff;color:#59667A;font-size:12.5px}
#stage{position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#stage iframe.on{display:block}
@media print{body.view-only{background:#fff}body.view-only #app{display:none!important}body.view-only::before{content:"Pencetakan dinonaktifkan untuk akun ini.";display:block;padding:24px}}
@media (max-width:640px){.dv-bar{padding:10px 14px}.dv-tab{padding:7px 16px}.dv-right{margin-left:0}}
</style>
</head>
<body>
<div class="lg" id="login">

    <p class="lg-co">PT Perintis Perkasa, Medan</p>
    <h1>SPK Blank</h1>
    <div class="lg-field">
      <input id="lg-pw" name="akses" type="password" placeholder="Masukkan password" aria-label="Password" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
      <button type="button" class="lg-eye" id="lg-eye" aria-label="Tampilkan password" aria-pressed="false"></button>
    </div>
    <button type="submit" id="lg-btn">Masuk</button>
    <p id="lg-err" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
  <header class="dv-bar">

    <div class="dv-right"><span class="dv-mode" id="dv-mode"></span></div>
  </header>

  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.7 10.7 0 0 1 12 4.5c6.5 0 10.5 7.5 10.5 7.5a17.6 17.6 0 0 1-3.3 4.2M6.6 6.7A17.4 17.4 0 0 0 1.5 12S5.5 19.5 12 19.5c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/></svg>';
  $('lg-eye').innerHTML = EYE;
  $('lg-eye').addEventListener('click', function(){
    var i = $('lg-pw'), show = i.type==='password';
    i.type = show ? 'text' : 'password';
    this.innerHTML = show ? EYE_OFF : EYE;
    this.setAttribute('aria-pressed', show ? 'true' : 'false');
    this.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    i.focus();
  });
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }

  function deriveKey(pw){
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(vault.salt), iterations:vault.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    });
  }
  function unwrap(kek, w){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(w.iv)}, kek, b64(w.ct)).then(function(raw){ return raw; }, function(){ return null; });
  }
  function gunzip(buf){
    var ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
    w.write(new Uint8Array(buf)); w.close();
    return new Response(ds.readable).text();
  }
  function decryptDoc(k, rawKey){
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']).then(function(ck){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(vault.docs[k].iv)}, ck, b64(vault.docs[k].ct));
    }).then(gunzip);
  }
  // Cari divisi mana yang bisa dibuka oleh password ini, dan dengan hak apa (div = hanya lihat, master = penuh)
  async function authenticate(pw){
    var kek = await deriveKey(pw), found = {}, role = null;
    for(var i=0;i<KEYS.length;i++){
      var k = KEYS[i];
      var raw = null, ms = vault.wraps[k].master;
      for(var j=0;j<ms.length && !raw;j++){ raw = await unwrap(kek, ms[j]); }
      if(raw){ found[k] = raw; role = 'master'; continue; }
      raw = await unwrap(kek, vault.wraps[k].div);
      if(raw){ found[k] = raw; role = role || 'div'; }
    }
    return role ? {role:role, keys:found} : null;
  }

  var session = null, tabs = [];
  async function show(k){
    var f = document.getElementById('f-'+k);
    if(!f){
      var html = await decryptDoc(k, session.keys[k]);
      if(session.role!=='master'){      // akun per divisi: hanya lihat, tanpa export dan cetak
        html = html.replace('<head>', '<head><script>window.__VIEW_ONLY=true;window.__LIMITED={"blank":["s2"],"audit":["cek","nomor","kosong"]};document.documentElement.classList.add("view-only");<\/script>');
      }
      f = document.createElement('iframe'); f.id = 'f-'+k; f.title = 'SPK Blank '+NAMES[k];
      f.srcdoc = html; html = null;
      $('stage').appendChild(f);
    }
    Array.prototype.forEach.call($('stage').children, function(x){ x.classList.toggle('on', x===f); });
    tabs.forEach(function(t){ var on = t.dataset.div===k; t.setAttribute('aria-selected', on?'true':'false'); t.tabIndex = on?0:-1; });
    document.title = 'SPK Blank '+NAMES[k];
  }
  async function start(){
    var allowed = KEYS.filter(function(k){ return session.keys[k]; });
    // alamat Apps Script live per divisi lewat alamat halaman, hanya untuk divisi yang boleh dibuka
    try{
      var q = new URLSearchParams(location.search);
      allowed.forEach(function(k){ var v = q.get('live-'+k); if(v==='off') localStorage.removeItem('spk-live-url-'+k); else if(v) localStorage.setItem('spk-live-url-'+k, v); });
    }catch(e){}
    var master = session.role==='master';
    document.body.classList.toggle('view-only', !master);
    $('dv-mode').textContent = master ? 'Akses penuh' : 'Hanya lihat';
    $('dv-title').textContent = master ? 'SPK Blank' : 'SPK Blank '+NAMES[allowed[0]];
    var nav = $('dv-tabs'); nav.innerHTML = ''; tabs = [];
    if(master){
      allowed.forEach(function(k,i){
        var b = document.createElement('button'); b.type = 'button'; b.className = 'dv-tab'; b.setAttribute('role','tab'); b.dataset.div = k; b.textContent = NAMES[k];
        b.addEventListener('click', function(){ show(k); });
        b.addEventListener('keydown', function(e){
          var d = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0; if(!d) return;
          var n = tabs[(i+d+tabs.length)%tabs.length]; n.focus(); show(n.dataset.div); e.preventDefault();
        });
        nav.appendChild(b); tabs.push(b);
      });
    }
    $('login').hidden = true; $('app').hidden = false;
    var h = location.hash.replace('#','');
    await show(master && allowed.indexOf(h)>=0 ? h : allowed[0]);
  }
  window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });   // kembali lewat riwayat browser: wajib login lagi

  $('lg-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var pw = $('lg-pw').value, btn = $('lg-btn'), err = $('lg-err');
    if(!pw) return;
    if(!(window.crypto && crypto.subtle) || typeof DecompressionStream==='undefined'){
      err.textContent = 'Browser ini tidak mendukung enkripsi yang dibutuhkan. Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.'; return;
    }
    btn.disabled = true; btn.textContent = 'Memeriksa...'; err.textContent = '';
    try{
      session = await authenticate(pw);
      $('lg-pw').value = ''; $('lg-pw').type = 'password'; $('lg-eye').innerHTML = EYE; pw = null;
      if(!session){
        await new Promise(function(r){ setTimeout(r, 800); });
        err.textContent = 'Password salah.'; $('lg-pw').focus();
      } else {
        await start();
      }
    }catch(ex){ console.error(ex); err.textContent = 'Gagal membuka: '+ex.message; session = null; }
    btn.disabled = false; btn.textContent = 'Masuk';
  });
})();
</script>
</body>
</html>
