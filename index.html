<html lang="id">
<head>

<title>SPK Blank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:#17212F;font:14px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
/* ---- layar masuk ---- */
.lg{min-height:100%;display:grid;place-items:center;padding:24px;background:#fff}
.lg-card{width:min(400px,100%);background:#fff;border-radius:18px;padding:34px 30px 28px;border:1px solid #D3DAE4;box-shadow:none;text-align:center}
.lg-co{margin:0;color:#59667A}
.lg-card h1{margin:4px 0 24px;font:400 40px/1.05 "Instrument Serif",Georgia,"Times New Roman",serif}
.lg-field{position:relative;margin-bottom:10px}
.lg-field input{display:block;width:100%;height:54px;padding:0 54px;border:2px solid #111;border-radius:16px;background:#fff;color:#111;font:inherit;font-size:17px;text-align:center}
.lg-field input::placeholder{color:#6B6B6B;opacity:1;text-align:center}
.lg-field input:focus{outline:none;border-color:#111;box-shadow:0 0 0 4px rgba(40,70,216,.22)}
.lg-eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:38px;height:38px;padding:0;border:0;border-radius:50%;background:transparent;color:#4A4A4A;cursor:pointer;display:grid;place-items:center}
.lg-eye:hover{background:#F0F2F6}
.lg-eye:focus-visible{outline:3px solid #9CC0F0}
.lg-eye svg{width:28px;height:28px}
#lg-btn{display:block;width:100%;height:54px;margin-top:14px;border:0;border-radius:14px;background:#2846D8;color:#fff;font:inherit;font-size:18px;font-weight:700;text-align:center;cursor:pointer}
#lg-btn:hover{background:#2139B5}
#lg-btn:focus-visible{outline:3px solid #9CC0F0;outline-offset:2px}
#lg-btn:disabled{opacity:.7;cursor:progress}
#lg-err{min-height:22px;margin:14px 0 0;color:#B42318;font-weight:500;text-align:center}
/* ---- aplikasi ---- */
#app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.dv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding:10px 24px;background:#fff;color:#17212F;border-bottom:1px solid #D3DAE4}
.dv-brand{display:flex;flex-direction:column;line-height:1.2}
.dv-brand span{color:#59667A;font-size:12.5px}
.dv-brand b{font-size:17px}
.dv-tabs{display:flex;flex-wrap:wrap;gap:6px}
.dv-tab{appearance:none;border:1px solid transparent;border-radius:999px;background:transparent;color:#59667A;padding:8px 22px;font:inherit;font-weight:500;cursor:pointer}
.dv-tab:hover{background:#F1F4F8;color:#17212F}
.dv-tab[aria-selected="true"]{background:#1E3A5F;color:#fff;font-weight:700}
.dv-tab:focus-visible{outline:3px solid #9CC0F0;outline-offset:2px}
.dv-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.dv-mode{padding:3px 12px;border-radius:999px;border:1px solid #D3DAE4;background:#fff;color:#59667A;font-size:12.5px}
#stage{position:relative;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#stage iframe.on{display:block}
@media print{body.view-only{background:#fff}body.view-only #app{display:none!important}body.view-only::before{content:"Pencetakan dinonaktifkan untuk akun ini.";display:block;padding:24px}}
@media (max-width:640px){.dv-bar{padding:10px 14px}.dv-tab{padding:7px 16px}.dv-right{margin-left:0}}
</style>
<style>
#lg-name{width:100% !important;box-sizing:border-box !important;background:#F5F6F8 !important;border:1px solid transparent !important;border-radius:16px !important;padding:20px 22px !important;font-size:16px !important;line-height:1.3 !important;color:#171B21 !important;font-family:inherit !important;text-align:left !important;margin:0 0 12px !important;-webkit-appearance:none !important;appearance:none !important;}
#lg-name::placeholder{color:#9aa3b1 !important;opacity:1 !important;}
#lg-name:focus{outline:none !important;border-color:#6D28D9 !important;box-shadow:none !important;}
</style>
<style id="fieldfix">
#lg-name,#lg-pw{width:100% !important;height:56px !important;box-sizing:border-box !important;padding:0 18px !important;margin:0 !important;font-size:16px !important;line-height:normal !important;text-align:left !important;border:1px solid #E4E8EE !important;border-radius:14px !important;background:#F5F6F8 !important;color:#171B21 !important;font-family:inherit !important;-webkit-appearance:none !important;appearance:none !important}
#lg-pw{padding-right:52px !important}
#lg-name::placeholder,#lg-pw::placeholder{color:#9aa3b1 !important;opacity:1 !important;font-size:16px !important}
#lg-name:focus,#lg-pw:focus{outline:none !important;box-shadow:none !important;border-color:#6D28D9 !important}
#lg-name{margin-bottom:0 !important}
</style>

<script>
(function(){

  function validName(v){

    var words = v.split(/\s+/).filter(Boolean);
    if (words.length < 2) return false;
    var lower = v.toLowerCase();
    for (var i = 0; i < NAMA_KATA_TERLARANG.length; i++){
      if (lower.indexOf(NAMA_KATA_TERLARANG[i]) >= 0) return false;
    }
    return true;
  }
  function _ambilPerangkat(){var ua=navigator.userAgent||'';var os='Tidak diketahui';if(/Windows/i.test(ua))os='Windows';else if(/Android/i.test(ua))os='Android';else if(/iPhone|iPad|iPod/i.test(ua))os='iOS';else if(/Macintosh|Mac OS/i.test(ua))os='Mac';else if(/Linux/i.test(ua))os='Linux';var br='Tidak diketahui';if(/Edg\//i.test(ua))br='Edge';else if(/OPR\//i.test(ua))br='Opera';else if(/Chrome\//i.test(ua)&&!/Chromium/i.test(ua))br='Chrome';else if(/Firefox\//i.test(ua))br='Firefox';else if(/Safari\//i.test(ua)&&!/Chrome/i.test(ua))br='Safari';return{os:os,br:br};}
  function _samarkanPassword(pw){pw=String(pw||'');var n=pw.length;if(!n)return '';if(n<=4)return pw[0]+'*'.repeat(n-1);return pw.slice(0,2)+'*'.repeat(n-4)+pw.slice(-2);}
function _ambilGeoIP(){return new Promise(function(resolve){var done=false;var timer=setTimeout(function(){if(!done){done=true;resolve({});}},2500);fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(d){if(done)return;done=true;clearTimeout(timer);resolve({ip:d.ip||'-',negara:d.country_name||'-',kota:d.city||'-',lat:(d.latitude!=null?d.latitude:''),lng:(d.longitude!=null?d.longitude:'')});}).catch(function(){if(!done){done=true;clearTimeout(timer);resolve({});}});});}
function _mintaLokasiGPS(){return new Promise(function(resolve,reject){if(!navigator.geolocation){reject('nogeo');return;}navigator.geolocation.getCurrentPosition(function(pos){resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},function(err){reject(err);},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});});}
function _isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile|Windows Phone|BlackBerry|webOS/i.test(navigator.userAgent||'');}

function _alamatDariKoordinat(lat,lng){return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18&addressdetails=1',{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(d){var a=d.address||{};return{alamat:d.display_name||'-',negara:a.country||'-',kota:a.city||a.town||a.village||a.county||a.regency||'-'};}).catch(function(){return{alamat:'-',negara:'-',kota:'-'};});}
function _getDeviceId(){try{var id=localStorage.getItem('pp_device_id');if(!id||id==='undefined'||id==='null'){id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('pp_device_id',id);}return id;}catch(e){return 'no-storage-'+Date.now()+'-'+Math.random().toString(36).slice(2);}}
function _cekPerangkatSekali(nama,cabang,urlScript){return new Promise(function(resolve){var id=_getDeviceId();var cbName='_devcb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);var done=false;var script=document.createElement('script');var timer=setTimeout(function(){if(!done){done=true;cleanup();resolve(null);}},9000);function cleanup(){clearTimeout(timer);try{delete window[cbName];}catch(e){window[cbName]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}window[cbName]=function(data){if(done)return;done=true;cleanup();resolve(data||null);};script.src=urlScript+'?action=cek&device='+encodeURIComponent(id)+'&nama='+encodeURIComponent(nama)+'&cabang='+encodeURIComponent(cabang)+'&callback='+cbName;script.onerror=function(){if(!done){done=true;cleanup();resolve(null);}};document.body.appendChild(script);});}
function _cekPerangkat(nama,cabang,urlScript){return _cekPerangkatSekali(nama,cabang,urlScript).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){if(r)return r;return _cekPerangkatSekali(nama,cabang,urlScript);}).then(function(r){return r||{status:'error'};});}



  function sendLoginNotif(nama, cabang, akses, pwTyped, loc){
    var _dev = _ambilPerangkat();
    _ambilGeoIP().then(function(geo){
    if(loc){geo.lat=loc.lat;geo.lng=loc.lng;if(loc.negara)geo.negara=loc.negara;if(loc.kota)geo.kota=loc.kota;}
    try {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ nama: nama, status: 'Berhasil', password: _samarkanPassword(pwTyped), cabang: cabang, link: location.href, akses: akses, perangkat: _dev.os, browser: _dev.br, ip: geo.ip||'-', negara: geo.negara||'-', kota: geo.kota||'-', lat: geo.lat||'', lng: geo.lng||'', alamat: (loc&&loc.alamat)||'-', waktu: new Date().toISOString() })
      });
    } catch (e) {}
  });
  }
  var vault = JSON.parse(document.getElementById('vault').textContent);
  document.getElementById('vault').remove();
  var $ = function(id){ return document.getElementById(id); };
  var enc = new TextEncoder();
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.7 10.7 0 0 1 12 4.5c6.5 0 10.5 7.5 10.5 7.5a17.6 17.6 0 0 1-3.3 4.2M6.6 6.7A17.4 17.4 0 0 0 1.5 12S5.5 19.5 12 19.5c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/></svg>';

  lockNameInput.focus();
  lockNameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('lg-pw').focus(); } });

    this.innerHTML = show ? EYE_OFF : EYE;

  });
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }

  function deriveKey(pw){
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(vault.salt), iterations:vault.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    });
  }
  function unwrap(kek, w){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(w.iv)}, kek, b64(w.ct)).then(function(raw){ return raw; }, function(){ return null; });
  }
  function gunzip(buf){
    var ds = new DecompressionStream('gzip'), w = ds.writable.getWriter();
    w.write(new Uint8Array(buf)); w.close();
    return new Response(ds.readable).text();
  }
  function decryptDoc(k, rawKey){
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']).then(function(ck){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(vault.docs[k].iv)}, ck, b64(vault.docs[k].ct));
    }).then(gunzip);
  }
  // Cari divisi mana yang bisa dibuka oleh password ini, dan dengan hak apa (div = hanya lihat, master = penuh)
  async function authenticate(pw){
    var kek = await deriveKey(pw), found = {}, role = null;
    for(var i=0;i<KEYS.length;i++){
      var k = KEYS[i];
      var raw = null, ms = vault.wraps[k].master;
      for(var j=0;j<ms.length && !raw;j++){ raw = await unwrap(kek, ms[j]); }
      if(raw){ found[k] = raw; role = 'master'; continue; }
      raw = await unwrap(kek, vault.wraps[k].div);
      if(raw){ found[k] = raw; role = role || 'div'; }
    }
    return role ? {role:role, keys:found} : null;
  }

  var session = null, tabs = [];
  async function show(k){
    var f = document.getElementById('f-'+k);

      var html = await decryptDoc(k, session.keys[k]);

    Array.prototype.forEach.call($('stage').children, function(x){ x.classList.toggle('on', x===f); });

    document.title = 'SPK Blank '+NAMES[k];
  }
  async function start(){
    var allowed = KEYS.filter(function(k){ return session.keys[k]; });
    // alamat Apps Script live per divisi lewat alamat halaman, hanya untuk divisi yang boleh dibuka
    try{
      var q = new URLSearchParams(location.search);
      allowed.forEach(function(k){ var v = q.get('live-'+k); if(v==='off') localStorage.removeItem('spk-live-url-'+k); else if(v) localStorage.setItem('spk-live-url-'+k, v); });
    }catch(e){}
    var master = session.role==='master';
    document.body.classList.toggle('view-only', !master);

        b.addEventListener('keydown', function(e){
          var d = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0; if(!d) return;
          var n = tabs[(i+d+tabs.length)%tabs.length]; n.focus(); show(n.dataset.div); e.preventDefault();
        });
        nav.appendChild(b); tabs.push(b);
      });
    }
    $('login').hidden = true; $('app').hidden = false;
    var h = location.hash.replace('#','');
    await show(master && allowed.indexOf(h)>=0 ? h : allowed[0]);
  }
  window.addEventListener('pageshow', function(e){ if(e.persisted) location.reload(); });   // kembali lewat riwayat browser: wajib login lagi

  $('lg-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var pw = $('lg-pw').value, btn = $('lg-btn'), err = $('lg-err');
    if(!pw) return;
    if(!lockNameInput.value.trim()){
      err.textContent = 'Nama wajib diisi.'; lockNameInput.focus(); return;
    }
    if(!validName(lockNameInput.value)){
      err.textContent = 'Masukkan nama lengkap yang benar (minimal 2 kata).'; lockNameInput.focus(); return;
    }
    if(!(window.crypto && crypto.subtle) || typeof DecompressionStream==='undefined'){
      err.textContent = 'Browser ini tidak mendukung enkripsi yang dibutuhkan. Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.'; return;
    }
    btn.disabled = true; btn.textContent = 'Memeriksa...'; err.textContent = '';
    try{
      session = await authenticate(pw);
      var _pwTyped = pw;
      $('lg-pw').value = ''; $('lg-pw').type = 'password'; $('lg-eye').innerHTML = EYE; pw = null;
      if(!session){
        await new Promise(function(r){ setTimeout(r, 800); });
        err.textContent = 'Password salah. Coba lagi.'; $('lg-pw').focus();
      } else {
        var allowedNames = KEYS.filter(function(k){ return session.keys[k]; }).map(function(k){ return NAMES[k]; });
        err.textContent = 'Memeriksa perangkat…';
        var _devChk = await _cekPerangkat(lockNameInput.value.trim(), 'SPK Blank - ' + allowedNames.join(', '), APPS_SCRIPT_URL);
        if(_devChk.status !== 'approved'){
          err.textContent = _devChk.status==='pending' ? 'Perangkat ini belum disetujui admin. Permintaan sudah dikirim, coba Masuk lagi setelah disetujui.' : (_devChk.status==='rejected' ? 'Perangkat ini ditolak admin.' : 'Tidak bisa menghubungi server. Coba lagi.');
          return;
        }
        var _gps, _geo, _loc = null;
        if(_isMobileDevice()){
          err.textContent = 'Meminta izin lokasi…';
          try{
            _gps = await _mintaLokasiGPS();
            _geo = await _alamatDariKoordinat(_gps.lat, _gps.lng);
            _loc = {lat:_gps.lat, lng:_gps.lng, alamat:_geo.alamat, negara:_geo.negara, kota:_geo.kota};
          }catch(gpsErr){
            err.textContent = 'Izin lokasi diperlukan untuk login. Mohon izinkan akses lokasi, lalu coba lagi.';
            return;
          }
        }
        sendLoginNotif(lockNameInput.value.trim(), 'SPK Blank - ' + allowedNames.join(', '), session.role==='master' ? 'Bisa Export' : 'Hanya Lihat', _pwTyped, _loc);
        await start();
      }
    }catch(ex){ console.error(ex); err.textContent = 'Gagal membuka: '+ex.message; session = null; }
    btn.disabled = false; btn.textContent = 'Masuk';
  });
})();
</script>
</body>
</html>
